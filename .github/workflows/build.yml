name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_NAME: censorship

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test
      - run: go test .github/scripts/package-release.go .github/scripts/package-release_test.go
      - run: make race
      - run: make vet
      - run: make integration

  build:
    needs: test
    if: "${{ github.event_name != 'pull_request' }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - GOOS: linux
            GOARCH: amd64
            runner: ubuntu-24.04
          - GOOS: linux
            GOARCH: arm64
            runner: ubuntu-24.04-arm
          - GOOS: darwin
            GOARCH: amd64
            runner: macos-15-intel
          - GOOS: darwin
            GOARCH: arm64
            runner: macos-15
          - GOOS: windows
            GOARCH: amd64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set up MSYS2
        if: "${{ matrix.GOOS == 'windows' }}"
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: mingw-w64-x86_64-toolchain make
      - id: release_metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Build and package
        shell: ${{ matrix.GOOS == 'windows' && 'msys2 {0}' || 'bash' }}
        run: make package VERSION="${VERSION}" GOOS=${{ matrix.GOOS }} GOARCH=${{ matrix.GOARCH }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.GOOS }}-${{ matrix.GOARCH }}
          path: |
            dist/censorship_${{ steps.release_metadata.outputs.version }}_${{ matrix.GOOS }}_${{ matrix.GOARCH }}.zip
            dist/censorship_${{ steps.release_metadata.outputs.version }}_${{ matrix.GOOS }}_${{ matrix.GOARCH }}.zip.sha256

  build-windows-arm64:
    needs: test
    if: "${{ github.event_name != 'pull_request' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: release_metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: .
          packages: .
          targets: windows-arm64
          out-dir: dist/windows_arm64
          output: censorship.dll
          flags: -ldflags=-s -w
          x-flags: main.pluginVersion=${{ steps.release_metadata.outputs.version }}
      - name: Package artifact
        run: |
          go run ./.github/scripts/package-release.go \
            -library "dist/windows_arm64/censorship.dll" \
            -archive "dist/censorship_${VERSION}_windows_arm64.zip" \
            -checksum "dist/censorship_${VERSION}_windows_arm64.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: |
            dist/censorship_${{ steps.release_metadata.outputs.version }}_windows_arm64.zip
            dist/censorship_${{ steps.release_metadata.outputs.version }}_windows_arm64.zip.sha256

  build-freebsd-amd64:
    needs: test
    if: "${{ github.event_name != 'pull_request' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: release_metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: .
          packages: .
          targets: freebsd-amd64
          out-dir: dist/freebsd_amd64
          output: censorship.so
          flags: -ldflags=-s -w
          x-flags: main.pluginVersion=${{ steps.release_metadata.outputs.version }}
      - name: Package artifact
        run: |
          go run ./.github/scripts/package-release.go \
            -library "dist/freebsd_amd64/censorship.so" \
            -archive "dist/censorship_${VERSION}_freebsd_amd64.zip" \
            -checksum "dist/censorship_${VERSION}_freebsd_amd64.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-amd64
          path: |
            dist/censorship_${{ steps.release_metadata.outputs.version }}_freebsd_amd64.zip
            dist/censorship_${{ steps.release_metadata.outputs.version }}_freebsd_amd64.zip.sha256

  release:
    needs: [build, build-windows-arm64, build-freebsd-amd64]
    if: "${{ startsWith(github.ref, 'refs/tags/v') }}"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat release/*.sha256 | sort > release/checksums.txt
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file RELEASE_NOTES.md
            gh release upload "$tag" release/*.zip release/*.sha256 release/checksums.txt --clobber
          else
            gh release create "$tag" release/*.zip release/*.sha256 release/checksums.txt --verify-tag --notes-file RELEASE_NOTES.md
          fi
